name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Docker startup regression checks
        run: docker run --rm -v "$PWD:/source:ro" oven/bun:1.4.2-alpine sh /source/tests/docker-startup.sh
      - name: Real YouTube transport regression checks
        run: >-
          docker run --rm -v "$PWD:/source:ro" -w /source oven/bun:1.4.2-alpine
          sh -c 'apk add --no-cache ffmpeg nodejs && REQUIRE_YOUTUBE_TRANSPORT_TESTS=1 bun test tests/youtube-recovery.test.mjs'
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
